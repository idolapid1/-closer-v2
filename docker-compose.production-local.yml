services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: closer
      POSTGRES_USER: closer
      POSTGRES_PASSWORD: closer_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closer -d closer"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - closer_postgres_data:/var/lib/postgresql/data

volumes:
  closer_postgres_data:
